      validation: "Birthday banner displays when applicable, order summary shows all discounts"

    - step: 5
      name: "Enhanced Loading States"
      description: "Add skeleton UI and error handling to LoyaltyDashboard"
      file: "src/components/loyalty/LoyaltyDashboard.tsx"
      details: |
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState<string | null>(null);

        useEffect(() => {
          const loadLoyaltyData = async () => {
            try {
              setLoading(true);
              setError(null);
              await loyaltyService.getLoyaltyBalance();
            } catch (err: any) {
              setError(err.message || 'Failed to load loyalty data');
            } finally {
              setLoading(false);
            }
          };
          loadLoyaltyData();
        }, []);

        // Loading skeleton
