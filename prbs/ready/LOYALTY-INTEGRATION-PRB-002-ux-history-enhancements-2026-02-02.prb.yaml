  technical_specifications:
    - spec_id: "T1"
      description: "Update LoyaltyService getPointsHistory() signature"
      details: |
        async getPointsHistory(page: number = 1): Promise<{
          data: PointTransaction[];
          meta: {
            current_page: number;
            per_page: number;
            total: number;
            last_page: number;
          };
        }> {
          try {
            const response = await api.get(`/loyalty/ledger?page=${page}`);

            return {
              data: response.data.data.map(tx => ({
                id: tx.id.toString(),
                type: tx.type as 'earn' | 'redeem' | 'expire' | 'bonus',
                points: tx.points,
                description: tx.description,
                date: new Date(tx.created_at),
                expiryDate: tx.expires_at ? new Date(tx.expires_at) : undefined,
                orderId: tx.reference?.id?.toString()
              })),
              meta: {
                current_page: response.data.meta.current_page,
                per_page: response.data.meta.per_page,
                total: response.data.meta.total,
                last_page: Math.ceil(response.data.meta.total / response.data.meta.per_page)
              }
            };
          } catch (error) {
            console.error('Failed to fetch points history:', error);
            return { data: [], meta: { current_page: 1, per_page: 20, total: 0, last_page: 1 } };
          }
        }

    - spec_id: "T2"
