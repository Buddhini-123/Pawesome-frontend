processual_requirements:
  execution_steps:
    - step: 1
      name: "Feature Branch Creation"
      description: "Create feature/loyalty-checkout-integration branch"
      commands:
        - "git checkout -b feature/loyalty-checkout-integration"
      validation: "Branch created successfully"

    - step: 2
      name: "Knowledge Base Search"
      description: "Review LOYALTY_API_GUIDE.md and memory patterns"
      validation: "API endpoints and patterns understood"

    - step: 3
      name: "Add TypeScript Types"
      description: "Add RedeemPointsRequest/Response and EarnPointsRequest/Response types"
      file: "src/types/loyalty.ts"
      validation: "TypeScript compiles without errors"

    - step: 4
      name: "Implement redeemPoints() Method"
      description: "Add redeemPoints() to LoyaltyService with error handling"
      file: "src/services/loyalty.service.ts"
      details: |
        async redeemPoints(points: number, orderId: string, reason: string = 'Order discount'): Promise<RedeemPointsResponse> {
          try {
            const response = await api.post('/loyalty/redeem', {
              points,
              order_id: orderId,
              reason
            });

            // Refresh loyalty balance after redemption
            await this.getLoyaltyBalance();

            return response.data;
          } catch (error: any) {
            console.error('Point redemption failed:', error);
            throw new Error(handleLoyaltyApiError(error));
          }
        }
      validation: "Method compiles, returns typed response"

    - step: 5
      name: "Integrate Redemption in Checkout"
      description: "Update handlePlaceOrder() to call redeemPoints() before order creation"
      file: "src/components/pages/Shop/Checkout.tsx"
      details: |
        const handlePlaceOrder = async () => {
          try {
            setProcessingOrder(true);
            setError(null);

            // 1. Redeem points FIRST (if any)
            let redemptionSuccess = false;
            if (pointsToRedeem > 0) {
              try {
                const redemptionResult = await loyaltyService.redeemPoints(
                  pointsToRedeem,
                  'ORDER_PENDING', // Will be updated with real order ID later
                  'Checkout discount'
                );
                redemptionSuccess = true;
                console.log('Points redeemed:', redemptionResult);
              } catch (redemptionError: any) {
                setError(redemptionError.message);
                setProcessingOrder(false);
                return; // Stop checkout if redemption fails
              }
            }

            // 2. Create order with discounted total
            const orderData = {
              ...existingOrderData,
              loyalty_discount: redemptionValue,
              points_redeemed: pointsToRedeem
            };

            const order = await orderService.createOrder(orderData);

            // 3. Show success
            navigate('/order-confirmation', { state: { order } });

          } catch (error: any) {
            setError(error.message || 'Order creation failed');
          } finally {
            setProcessingOrder(false);
          }
        };
      validation: "Redemption called before order, errors handled"

    - step: 6
      name: "Update Order Point Earning"
      description: "Call /api/loyalty/earn after payment confirmation"
      file: "src/services/order.service.ts"
      details: |
        async createOrder(orderData: CreateOrderRequest): Promise<Order> {
          try {
            // Create order first
            const response = await api.post('/orders', orderData);
            const order = response.data;

            // Award points after payment confirmation
            if (order.payment_status === 'paid' || order.payment_status === 'confirmed') {
              try {
                const earnResult = await api.post('/loyalty/earn', {
                  order_id: order.id,
                  amount_paid: order.total
                });

                console.log('Points earned:', earnResult.data);

                // Show success notification
                toast.success(
                  `Order placed! You earned ${earnResult.data.points_earned} loyalty points!`,
                  { duration: 5000 }
                );

                // Refresh loyalty balance
                // LoyaltyContext will auto-refresh via useEffect

              } catch (loyaltyError) {
                // Don't fail order if loyalty API fails
                console.warn('Loyalty points award failed (non-critical):', loyaltyError);
              }
            }

            return order;
          } catch (error) {
            throw error;
          }
        }
      validation: "Points awarded after payment, order not blocked on loyalty failure"

    - step: 7
      name: "Add Error Handling Utility"
      description: "Create handleLoyaltyApiError() helper function"
      file: "src/services/loyalty.service.ts"
      details: |
        function handleLoyaltyApiError(error: any): string {
          if (error.response?.status === 401) {
            return 'Please log in to use loyalty points';
          }
          if (error.response?.status === 403) {
            return 'Insufficient loyalty points or unauthorized action';
          }
          if (error.response?.status === 422) {
            return error.response.data.message || 'Invalid loyalty request';
          }
          if (error.response?.status >= 500) {
            return 'Loyalty service temporarily unavailable. Your order will still be processed.';
          }
          return 'An unexpected error occurred with loyalty points';
        }
      validation: "All error codes handled with user-friendly messages"

    - step: 8
      name: "Testing & Validation"
      description: "Test complete checkout flow with redemption and earning"
      validation_checklist:
        - "User can redeem points during checkout"
        - "Redemption reduces loyalty balance correctly"
        - "Order total reflects redemption discount"
        - "Points awarded after order payment"
        - "Loyalty balance updates after earning"
        - "Error messages display on API failures"
        - "Checkout doesn't break if loyalty API down"
        - "TypeScript compiles without errors"
        - "No console errors in browser"

  quality_standards:
    - "TypeScript strict mode compliance"
    - "All async operations wrapped in try/catch"
    - "User-friendly error messages (not raw API errors)"
    - "Loading states prevent duplicate submissions"
    - "Non-critical failures (loyalty) don't block critical operations (order)"

  review_validation:
