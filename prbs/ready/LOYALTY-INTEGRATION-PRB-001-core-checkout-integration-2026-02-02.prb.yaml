  backend_api_documentation: |
    API Endpoints to integrate:

    1. POST /api/loyalty/redeem
       Request: { points: number, order_id: string, reason: string }
       Response: { message: string, points_redeemed: number, new_balance: number }
       Error: 422 (validation), 403 (insufficient points)

    2. POST /api/loyalty/earn
       Request: { order_id: number, amount_paid: number }
       Response: { message: string, points_earned: number, new_balance: number }
       Calculation: points = floor(amount_paid / 100)
       Error: 403 (unauthorized order), 422 (validation)

    Auth: Bearer token from localStorage.getItem('auth_token')
    All endpoints require Authentication header

