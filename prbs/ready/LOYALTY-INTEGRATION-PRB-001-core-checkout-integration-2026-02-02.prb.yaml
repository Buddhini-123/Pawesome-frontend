  technical_specifications:
    - spec_id: "T1"
      description: "TypeScript type definitions for API responses"
      details: |
        interface RedeemPointsRequest {
          points: number;
          order_id: string;
          reason: string;
        }

        interface RedeemPointsResponse {
          message: string;
          points_redeemed: number;
          new_balance: number;
        }

        interface EarnPointsRequest {
          order_id: number;
          amount_paid: number;
        }

        interface EarnPointsResponse {
          message: string;
          points_earned: number;
          new_balance: number;
        }

    - spec_id: "T2"
      description: "Error handling utility"
      details: |
        function handleLoyaltyApiError(error: any): string {
          if (error.response?.status === 401) return 'Please log in to use loyalty points';
          if (error.response?.status === 403) return 'Insufficient loyalty points or unauthorized';
          if (error.response?.status === 422) return error.response.data.message || 'Invalid request';
          return 'Loyalty service temporarily unavailable. Your order will still be processed.';
        }

