        - "Enforce minimum quantity of 1"
        - "Enforce maximum quantity of 99"
        - "Auto-remove items at quantity 0"
        - "Validate in both addItem and updateQuantity"

  technical_specifications:
    - spec_id: "T1"
      description: "Enhanced localStorage with error handling"
      details: |
        // Initial load with error handling
        const [cart, setCart] = useState<CartItem[]>(() => {
          try {
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
              const parsed = JSON.parse(savedCart);
              // Validate parsed data is an array
              if (Array.isArray(parsed)) {
                return parsed;
              }
            }
          } catch (error) {
            console.error('Failed to load cart from localStorage:', error);
            // Clear corrupted data
            localStorage.removeItem('cart');
          }
          return [];
        });

        // Save with error handling
        useEffect(() => {
          try {
            localStorage.setItem('cart', JSON.stringify(cart));
          } catch (error) {
            console.error('Failed to save cart to localStorage:', error);
            // Handle quota exceeded or other errors
          }
        }, [cart]);

    - spec_id: "T2"
      description: "Quantity validation in updateQuantity"
      details: |
        const updateQuantity = useCallback((id: string, quantity: number) => {
          // Validate quantity range
          if (quantity < 0) {
            console.warn('Invalid quantity: cannot be negative');
            return;
          }

          if (quantity > 99) {
            console.warn('Invalid quantity: maximum is 99');
            return;
          }

          if (quantity === 0) {
            removeItem(id);
            return;
          }

          setCart(prevCart =>
            prevCart.map(item =>
              item.id === id ? { ...item, quantity } : item
            )
          );
        }, [removeItem]);

    - spec_id: "T3"
      description: "Quantity validation in addItem"
      details: |
        const addItem = useCallback((product: Product, quantity: number = 1) => {
          // Validate quantity
          if (quantity < 1 || quantity > 99) {
            console.warn('Invalid quantity: must be between 1 and 99');
            return;
          }

          setCart(prevCart => {
            const existingItem = prevCart.find(item => item.product.id === product.id);

            if (existingItem) {
              // Check total quantity won't exceed limit
              const newQuantity = Math.min(existingItem.quantity + quantity, 99);

              return prevCart.map(item =>
                item.product.id === product.id
                  ? { ...item, quantity: newQuantity }
                  : item
              );
            }

            return [...prevCart, { id: product.id, product, quantity }];
          });
        }, []);

