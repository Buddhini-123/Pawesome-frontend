# Execution Steps
execution_steps:
  step_1_setup:
    description: "Setup test environment and start application"
    commands:
      - "cd /Users/vevomalik/Desktop/Pawsome/Pawesome-frontend"
      - "npm start"
    expected_output: "Application starts on localhost:3000 without errors"

  step_2_product_browsing:
    description: "Test product browsing and display"
    test_cases:
      - Navigate to shop page
      - Verify product grid displays
      - Check product images render
      - Verify product names, prices display
      - Click product for details view
      - Check product detail page renders
    validation: "All products display correctly without null/undefined errors"

  step_3_add_to_cart:
    description: "Test adding products to cart"
    test_cases:
      - Click "Add to Cart" on product
      - Verify cart counter increments
      - Add same product again
      - Verify quantity increases
      - Add different product
      - Verify multiple items in cart
      - Test adding with quantity selector
      - Check localStorage 'cart' key updated
    validation: "Cart counter and localStorage update correctly"

  step_4_cart_page:
    description: "Test cart page functionality"
    test_cases:
      - Navigate to /cart
      - Verify all cart items display
      - Check product images render (null safety)
      - Verify quantities match additions
      - Click quantity increment (+)
      - Verify quantity increases and price updates
      - Click quantity decrement (-)
      - Verify quantity decreases and price updates
      - Test decrement to 0 removes item
      - Click remove item (trash icon)
      - Verify item removed from cart
      - Check subtotal calculation correct
      - Check shipping calculation (free at ₹2000+)
      - Check total calculation correct
      - Test "Clear All" button
      - Verify cart emptied
      - Refresh page
      - Verify cart persists (localStorage)
    validation: "Cart operations work correctly, calculations accurate, persistence works"

  step_5_checkout_navigation:
    description: "Test navigation to checkout"
    test_cases:
      - Add items to cart
      - Navigate to cart page
      - Click "Proceed to Checkout"
      - Verify redirect to /checkout
      - Check authentication required or guest checkout
    validation: "Navigation to checkout works correctly"

  step_6_checkout_shipping:
    description: "Test shipping address form"
    test_cases:
      - Verify shipping form displays
      - Test form validation (empty fields)
      - Fill in shipping address
      - Verify form accepts valid input
      - Check saved addresses dropdown (if logged in)
      - Test selecting saved address
      - Verify form populates with saved address
      - Test custom address option
      - Click "Continue to Payment"
    validation: "Shipping form validation works, saved addresses load correctly"

  step_7_checkout_payment:
    description: "Test payment method selection"
    test_cases:
      - Verify payment methods display
      - Select Card payment
      - Verify card form displays
      - Test card form validation
      - Select UPI payment
      - Verify UPI ID field displays
      - Select COD payment
      - Verify COD selected
      - Select NetBanking
      - Verify bank selection displays
    validation: "Payment method selection and forms work correctly"

  step_8_loyalty_redemption:
    description: "Test loyalty points redemption"
    test_cases:
      - Check loyalty balance displays (if logged in)
      - Locate redemption slider
      - Drag slider to redeem points
      - Verify discount applied to total
      - Check order summary updates
      - Verify max redemption limits respected
    validation: "Loyalty redemption works correctly, totals update"

  step_9_order_summary:
    description: "Test order summary and calculations"
    test_cases:
      - Verify all cart items listed
      - Check product details correct
      - Verify subtotal matches cart total
      - Check shipping cost displayed
      - Verify loyalty discount applied
      - Check coupon discount (if applicable)
      - Verify final total calculation
      - Check all totals match expected values
    validation: "Order summary displays correctly, calculations accurate"

  step_10_place_order:
    description: "Test order placement"
    test_cases:
      - Click "Place Order" button
      - Verify loading state displays
      - Check order submission request
      - Verify success response
      - Check order confirmation displays
      - Verify loyalty points awarded message
      - Check cart cleared after order
      - Navigate back to cart
      - Verify cart empty
    validation: "Order placement works, loyalty points awarded, cart cleared"

  step_11_error_handling:
    description: "Test error scenarios"
    test_cases:
      - Test adding product without price
      - Test cart with missing product images
      - Test checkout without shipping address
      - Test payment submission failure
      - Test network error handling
      - Check console for error messages
    validation: "Error handling works gracefully, user-friendly error messages"

  step_12_console_review:
    description: "Review browser console for errors"
    test_cases:
      - Open browser developer console
      - Check for JavaScript errors
      - Check for React warnings
      - Check for network errors
      - Review console.log debugging messages
      - Verify no critical errors
    validation: "Console clean or only expected debugging logs"

