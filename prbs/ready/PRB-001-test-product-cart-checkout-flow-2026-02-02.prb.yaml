# Quality Gates
quality_gates:
  functional_requirements:
    - All cart operations (add, remove, update, clear) work correctly
    - Cart persistence via localStorage functions properly
    - Cart calculations (subtotal, shipping, total) are accurate
    - Checkout form validation works as expected
    - Payment method selection functions correctly
    - Loyalty points redemption applies discounts correctly
    - Order placement succeeds with valid data
    - Cart cleared after successful order

  non_functional_requirements:
    - No JavaScript errors in console
    - No React warnings for null/undefined rendering
    - Null safety for product images and data
    - Graceful error handling for API failures
    - Loading states display during async operations
    - Form validation provides clear error messages

  test_coverage:
    - All major user flows tested (happy path)
    - Edge cases tested (quantity limits, empty states)
    - Error scenarios tested (validation, API errors)
    - localStorage operations validated
    - Console output reviewed for errors

