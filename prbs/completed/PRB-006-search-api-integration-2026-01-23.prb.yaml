# BACKEND API SPEC
backend_api_specification:
  endpoint: "GET /api/search/products"
  method: "GET"
  authentication: "None (public endpoint)"
  query_parameters:
    - name: "q"
      type: "string"
      required: true
      description: "Search term to query products"
      example: "royal"
  response_format:
    success:
      status: 200
      content_type: "application/json"
      body: |
        [
          {
            "id": "1",
            "name": "Royal Canin Dog Food",
            "brand": "Royal Canin",
            "price": 2500,
            "image": "/images/products/royal-canin.jpg",
            "description": "Premium dog food...",
            "sku": "RC-DOG-001",
            "category": "dogs",
            "subcategory": "food",
            "in_stock": true,
            "rating": 4.8,
            "reviews": 125
          }
        ]
    empty:
      status: 200
      body: "[]"
    error:
      status: 500
      body: |
        {
          "error": "Search service unavailable"
        }
  example_usage: |
    // In products.service.ts
    async searchProducts(query: string): Promise<Product[]> {
      try {
        const response = await api.request<Product[]>(
          `/search/products?q=${encodeURIComponent(query)}`,
          { method: 'GET' }
        );
        return response.success && response.data ? response.data : [];
      } catch (error) {
        console.error('Search failed:', error);
        return [];
      }
    }

    // In SearchResults.tsx
    const [searchParams] = useSearchParams();
    const query = searchParams.get('q') || '';

    useEffect(() => {
      const fetchResults = async () => {
        setLoading(true);
        const results = await productsService.searchProducts(query);
        setResults(results);
        setLoading(false);
      };
      if (query) fetchResults();
    }, [query]);
